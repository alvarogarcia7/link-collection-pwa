<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#4A90E2" rx="80"/>

  <!-- Book icon -->
  <g fill="#FFFFFF">
    <!-- Book cover -->
    <rect x="140" y="120" width="232" height="280" rx="8" fill="#FFFFFF"/>

    <!-- Book spine shadow -->
    <rect x="140" y="120" width="20" height="280" fill="#E0E0E0" rx="8"/>

    <!-- Book pages -->
    <line x1="180" y1="120" x2="180" y2="400" stroke="#4A90E2" stroke-width="2"/>

    <!-- Link icon overlay -->
    <g transform="translate(240, 220)">
      <!-- Chain link -->
      <path d="M 0 20 Q -10 20 -10 10 Q -10 0 0 0 L 20 0"
            stroke="#4A90E2"
            stroke-width="12"
            fill="none"
            stroke-linecap="round"/>
      <path d="M 40 20 Q 50 20 50 10 Q 50 0 40 0 L 20 0"
            stroke="#4A90E2"
            stroke-width="12"
            fill="none"
            stroke-linecap="round"/>
      <line x1="15" y1="10" x2="25" y2="10"
            stroke="#4A90E2"
            stroke-width="12"
            stroke-linecap="round"/>
    </g>

    <!-- Decorative lines (text representation) -->
    <rect x="200" y="160" width="120" height="6" rx="3" fill="#4A90E2" opacity="0.6"/>
    <rect x="200" y="180" width="100" height="6" rx="3" fill="#4A90E2" opacity="0.6"/>
    <rect x="200" y="200" width="110" height="6" rx="3" fill="#4A90E2" opacity="0.6"/>

    <rect x="200" y="320" width="120" height="6" rx="3" fill="#4A90E2" opacity="0.6"/>
    <rect x="200" y="340" width="90" height="6" rx="3" fill="#4A90E2" opacity="0.6"/>
    <rect x="200" y="360" width="105" height="6" rx="3" fill="#4A90E2" opacity="0.6"/>
  </g>
</svg>
